<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="GymKhata — kill silent churn. Renewal and win-back software for gyms.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7F2"/>
      <stop offset="1" stop-color="#EFE6DB"/>
    </linearGradient>
  </defs>

  <!-- paper background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- left accent rail -->
  <rect x="0" y="0" width="18" height="630" fill="#DC2626"/>

  <!-- churn-meter motif: fading dots pulled back to red, top-right -->
  <g transform="translate(792,96)">
    <circle cx="0"   cy="0"  r="13" fill="#1A1514"/>
    <circle cx="52"  cy="0"  r="13" fill="#1A1514"/>
    <circle cx="104" cy="0"  r="13" fill="#C9BEB2"/>
    <circle cx="156" cy="0"  r="13" fill="#1A1514"/>
    <circle cx="208" cy="0"  r="13" fill="#DC2626"/>
    <circle cx="260" cy="0"  r="13" fill="#1A1514"/>
    <circle cx="312" cy="0"  r="13" fill="#0F7A4D"/>
    <circle cx="0"   cy="52" r="13" fill="#C9BEB2"/>
    <circle cx="52"  cy="52" r="13" fill="#DC2626"/>
    <circle cx="104" cy="52" r="13" fill="#1A1514"/>
    <circle cx="156" cy="52" r="13" fill="#0F7A4D"/>
    <circle cx="208" cy="52" r="13" fill="#1A1514"/>
    <circle cx="260" cy="52" r="13" fill="#C9BEB2"/>
    <circle cx="312" cy="52" r="13" fill="#DC2626"/>
  </g>

  <!-- KARYA wordmark, top-left -->
  <g transform="translate(80,96)">
    <!-- dumbbell mark -->
    <g stroke="#DC2626" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M2 8v20M50 8v20M12 4v28M40 4v28M2 18h10M40 18h10M12 18h28"/>
    </g>
    <text x="70" y="30" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#1A1514">KARYA</text>
  </g>

  <!-- product name, large -->
  <text x="78" y="330" font-family="Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#1A1514">Gym<tspan fill="#DC2626">Khata</tspan></text>

  <!-- tagline -->
  <text x="80" y="410" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#1A1514">Kill silent churn.</text>

  <!-- sub-line -->
  <text x="80" y="470" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#4A423E">Renewal &amp; win-back software for gyms and fitness studios.</text>

  <!-- footer band -->
  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#DC2626">Subscription · pricing on discovery</text>
  <text x="1120" y="560" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#4A423E">Built for India</text>
</svg>
